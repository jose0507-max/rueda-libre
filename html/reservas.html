<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
    <iframe src="./nav.html" width="100%" height="100" frameborder="0" title="Nav bar"></iframe>
    <link rel="stylesheet" href="../css/reservas.css">
    <h1>Reserva tu bicicleta</h1>
    <a href="mailto:joselondono0507@gmail.com">Contáctanos</a>
    <label for="">Horario</label>

</head>

<body>
    <form class="form-control" action="">
        <div class="info-usuario">
            <h2>Información del usuario</h2>
            <label for="nombre">Nombre</label><br>
            <input type="text" name="" id="nombre" placeholder="Ingrese aquí su nombre"><br>

            <label for="apellido">Apellido</label><br>
            <input type="text" name="" id="apellido" placeholder="Ingrese aquí su apellido"><br>

            <label for="documento">Numero de documento</label><br>
            <input type="text" name="" id="documento" placeholder="Ingrese aquí su número de documento"><br>

            <label for="correo">Correo electrónico</label><br>
            <input type="email" name="" id="correo" placeholder="Ingrese aquí su correo electrónico">
        </div>
        <div class="info-alquiler">
            <h2>Información del alquiler</h2>
            <label for="tipo-bicicleta">Tipo de bicicleta</label><br>
            <select name="" id="tipo-bicicleta">
                <option value="">Seleccione el tipo de bicicleta</option>
                <option value="">Urbana</option>
                <option value="">Montaña</option>
                <option value="">Eléctrica</option>
            </select><br>

            <label for="fecha-alquiler">Fecha de alquiler</label><br>
            <input type="date" name="" id="fecha-alquiler"><br>

            <label for="hora-alquiler">Hora de alquiler</label><br>
            <input type="time" name="" id="hora-alquiler"><br>

            <label for="duracion-alquiler">Duración del alquiler</label><br>
            <input type="number" name="" id="duracion-alquiler" placeholder="Ingrese la duración en horas"><br>

            <button type="submit">Reservar</button>
        </div>

    </form>
</body>

</html>
